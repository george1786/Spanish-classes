<div class="calendar-page">
  <div class="calendar-header">
    <h1>Google Class Calendar</h1>
    <p>Live schedule for students and families.</p>
  </div>

  <div class="google-calendar-embed">
    <iframe
      [src]="googleCalendarSrc"
      title="Spanish classes Google Calendar"
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"
    ></iframe>
  </div>
</div>
